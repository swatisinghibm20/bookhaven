<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BookHaven – Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
  header { background: #1e3a5f; color: #fff; padding: 14px 32px; display: flex; align-items: center; gap: 10px; }
  header .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  header .logo span { color: #f59e0b; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 40px 36px; width: 100%; max-width: 420px; }
  .card h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #1e3a5f; }
  .card p.sub { font-size: 13px; color: #6b7280; margin-bottom: 28px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; color: #1f2328; margin-bottom: 18px; background: #f9fafb; }
  input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .row label { font-size: 13px; font-weight: 400; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .row a { font-size: 13px; color: #3b82f6; text-decoration: none; }
  .btn-primary { width: 100%; padding: 11px; background: #1e3a5f; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: #9ca3af; font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
  .btn-social { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; font-size: 14px; font-weight: 500; color: #374151; cursor: pointer; margin-bottom: 10px; }
  .register { text-align: center; margin-top: 22px; font-size: 13px; color: #6b7280; }
  .register a { color: #3b82f6; text-decoration: none; font-weight: 600; }
  footer { background: #1e3a5f; color: #9ca3af; text-align: center; padding: 14px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="logo">Book<span>Haven</span></div>
</header>
<main>
  <div class="card">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your BookHaven account</p>

    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <div class="row">
      <label><input type="checkbox" style="width:auto;margin-bottom:0;" /> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>

    <button class="btn-primary">Sign In</button>

    <div class="divider">or continue with</div>

    <button class="btn-social">&#x1F30D;&nbsp; Continue with Google</button>
    <button class="btn-social">&#xf09b;&nbsp; Continue with GitHub</button>

    <div class="register">
      Don't have an account? <a href="#">Create one</a>
    </div>
  </div>
</main>
<footer>&copy; 2025 BookHaven. All rights reserved.</footer>
</body>
</html>
